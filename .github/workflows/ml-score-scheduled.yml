name: ML score unscored rows

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Score rows missing predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_URL: ${{ secrets.DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          SUPABASE_STORAGE_BUCKET_MODELS: ${{ secrets.SUPABASE_STORAGE_BUCKET_MODELS }}
          MODEL_JOBLIB_PATH: ${{ secrets.MODEL_JOBLIB_PATH }}
        run: python -m ml.score_incremental
